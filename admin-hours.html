<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Hours | Admin | San Diego East County Aquatics</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" href="images/eca-logo.png">
<link rel="apple-touch-icon" href="images/eca-logo.png">
<meta name="theme-color" content="#0a1f6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img src="images/eca-logo.png" alt="ECA Waterpolo logo" class="logo-mark">
      <span class="brand-text"><strong>East County Aquatics</strong><span>San Diego Water Polo</span></span>
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about-us.html">About Us</a></li>
        <li><a href="teams.html">Teams</a></li>
        <li><a href="masters.html">Masters</a></li>
        <li><a href="junior-olympics.html">Junior Olympics</a></li>
        <li><a href="support.html">Donate/Sponsor</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li id="nav-auth-slot"></li>
      </ul>
    </nav>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span></button>
  </div>
</header>

<section class="admin-header">
  <div class="container">
    <h1>Coach Hours</h1>
    <p><a href="admin.html" style="color:var(--gold);">&larr; Back to Admin</a></p>
  </div>
</section>

<style>
  .hours-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border:1px solid #e3edf3;border-radius:10px;margin-bottom:10px;background:#fff;}
  .hours-total strong{font-size:16px;}
  .hours-total .big{font-size:22px;font-weight:800;color:var(--blue);}
  .hours-detail{font-size:13px;color:var(--muted);margin:2px 0 0;}
  .hours-row{display:flex;justify-content:space-between;padding:7px 16px;font-size:13.5px;border-bottom:1px solid #f0f4f7;}
  .hours-row button{border:none;background:none;color:#c0392b;cursor:pointer;font-size:13px;margin-left:10px;}
  .hours-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;}
</style>

<section class="section-tight">
  <div class="container" style="max-width:760px;">
    <div id="scope-note" class="notice" style="margin-bottom:20px;"></div>

    <div class="admin-form" id="log-form-wrap" style="display:none;margin-bottom:24px;">
      <h3>Log Practice Hours</h3>
      <div id="log-msg" class="form-msg"></div>
      <form id="log-form" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
        <div class="field" style="margin:0;">
          <label for="log-date">Date</label>
          <input type="date" id="log-date" required>
        </div>
        <div class="field" style="margin:0;min-width:180px;">
          <label for="log-team">Team</label>
          <select id="log-team" required style="width:100%;padding:12px 14px;border:1px solid #d7e6ee;border-radius:8px;font-size:15px;background:#fff;"></select>
        </div>
        <div class="field" style="margin:0;">
          <label for="log-hours">Hours</label>
          <input type="number" id="log-hours" min="0.25" max="12" step="0.25" value="1.5" required style="max-width:110px;">
        </div>
        <button type="submit" class="btn btn-primary" id="log-submit">Add Hours</button>
      </form>
    </div>

    <div class="hours-filters">
      <div class="field" style="margin:0;">
        <label for="from-date">From</label>
        <input type="date" id="from-date">
      </div>
      <div class="field" style="margin:0;">
        <label for="to-date">To</label>
        <input type="date" id="to-date">
      </div>
      <button type="button" id="export-btn" class="btn btn-outline-dark">Export CSV</button>
    </div>

    <div id="list-msg" class="form-msg"></div>
    <div id="hours-list"><p class="muted">Loading&hellip;</p></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; <span id="year"></span> San Diego East County Aquatics. All rights reserved.</span>
      <span>Non-profit water polo club &middot; El Cajon, CA</span>
    </div>
  </div>
</footer>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function csvField(value) {
    let str = String(value == null ? "" : value);
    if (/^[=+\-@\t\r]/.test(str) && !/^-?\d+(\.\d+)?$/.test(str)) str = "'" + str;
    return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
  }
  function fmtDate(d) {
    return new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }

  var isOwner = false;
  var currentUserId = null;
  var loadedRows = [];
  var nameById = {};
  var teamLabels = {};
  var rateByCoachId = {}; // owner: everyone's; coach: just their own (RLS)
  function money(cents) {
    return "$" + (cents / 100).toFixed(2);
  }

  function monthStart() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10);
  }

  async function load() {
    const listEl = document.getElementById("hours-list");
    const msgEl = document.getElementById("list-msg");
    msgEl.className = "form-msg";

    const from = document.getElementById("from-date").value;
    const to = document.getElementById("to-date").value;

    let q = supabaseClient
      .from("coach_hours")
      .select("id, coach_id, team_slug, session_date, session_end_date, session_type, tournament_name, hours")
      .order("session_date", { ascending: false });
    // Everyone but the manager sees only their own hours, even where RLS
    // would show more (coaches can manage other coaches' tournament hours).
    if (!isOwner) q = q.eq("coach_id", currentUserId);
    if (from) q = q.gte("session_date", from);
    if (to) q = q.lte("session_date", to);

    const { data, error } = await q;
    if (error) {
      msgEl.className = "form-msg error";
      msgEl.textContent = "Could not load hours: " + error.message;
      listEl.innerHTML = "";
      return;
    }

    loadedRows = data || [];
    if (!loadedRows.length) {
      listEl.innerHTML = '<p class="muted">No hours logged in this date range. </p>';
      return;
    }

    // Group by coach so the owner reads one total per person, which is what
    // actually gets paid.
    const byCoach = {};
    loadedRows.forEach(function (r) {
      (byCoach[r.coach_id] = byCoach[r.coach_id] || []).push(r);
    });

    listEl.innerHTML = Object.keys(byCoach).map(function (coachId) {
      const rows = byCoach[coachId];
      const total = rows.reduce(function (s, r) { return s + parseFloat(r.hours); }, 0);
      const sessions = rows.length;
      const rateCents = rateByCoachId[coachId];
      const payRow = rateCents != null
        ? '<div class="hours-total" style="background:#f7f9fc;margin-top:-6px;">' +
            '<div class="muted" style="font-size:13px;">' + total.toFixed(2) + " hrs \u00d7 " + money(rateCents) + "/hr</div>" +
            '<div style="font-weight:800;color:var(--blue);">' + money(Math.round(total * rateCents)) + "</div>" +
          "</div>"
        : "";
      return '<div style="margin-bottom:18px;">' +
        '<div class="hours-total">' +
          "<div><strong>" + escapeHtml(nameById[coachId] || "Coach") + "</strong>" +
            '<p class="hours-detail">' + sessions + (sessions === 1 ? " session" : " sessions") + "</p></div>" +
          '<div class="big">' + total.toFixed(2) + " hrs</div>" +
        "</div>" +
        payRow +
        '<details><summary class="muted" style="cursor:pointer;font-size:13px;padding-left:16px;">Show each session</summary>' +
        rows.map(function (r) {
          const dateText = fmtDate(r.session_date) + (r.session_end_date ? " \u2013 " + fmtDate(r.session_end_date) : "");
          const tournBit = r.session_type === "tournament" ? " &middot; " + escapeHtml(r.tournament_name || "Tournament") : "";
          return '<div class="hours-row"><span>' + dateText + " &middot; " +
            escapeHtml(teamLabels[r.team_slug] || r.team_slug) + tournBit + "</span><span>" +
            parseFloat(r.hours).toFixed(2) + " hrs" +
            (!isOwner && r.session_type !== "tournament"
              ? '<button type="button" data-remove-hours="' + escapeHtml(r.id) + '" title="Remove">Remove</button>'
              : "") +
            "</span></div>";
        }).join("") +
        "</details></div>";
    }).join("");

    listEl.querySelectorAll("[data-remove-hours]").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        if (!confirm("Remove these hours?")) return;
        const { error } = await supabaseClient.from("coach_hours").delete().eq("id", btn.dataset.removeHours);
        if (error) {
          msgEl.className = "form-msg error";
          msgEl.textContent = "Could not remove: " + error.message;
          return;
        }
        load();
      });
    });
  }

  document.getElementById("log-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const msg = document.getElementById("log-msg");
    const btn = document.getElementById("log-submit");
    msg.className = "form-msg";
    const hours = parseFloat(document.getElementById("log-hours").value);
    if (!(hours > 0)) {
      msg.className = "form-msg error";
      msg.textContent = "Enter the hours you coached.";
      return;
    }
    btn.disabled = true;
    const { error } = await supabaseClient.from("coach_hours").insert({
      coach_id: currentUserId,
      team_slug: document.getElementById("log-team").value,
      session_date: document.getElementById("log-date").value,
      session_type: "practice",
      hours: hours,
    });
    btn.disabled = false;
    if (error) {
      msg.className = "form-msg error";
      msg.textContent = "Could not save: " + error.message;
      return;
    }
    msg.className = "form-msg success";
    msg.textContent = "Saved.";
    load();
  });

  document.getElementById("export-btn").addEventListener("click", function () {
    if (!loadedRows.length) return;
    const lines = [["Coach", "Date", "End Date", "Type", "Tournament", "Team", "Hours"].join(",")];
    loadedRows.forEach(function (r) {
      lines.push([
        nameById[r.coach_id] || "Coach",
        r.session_date,
        r.session_end_date || "",
        r.session_type || "practice",
        r.tournament_name || "",
        teamLabels[r.team_slug] || r.team_slug,
        parseFloat(r.hours).toFixed(2),
      ].map(csvField).join(","));
    });
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "eca-coach-hours-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  ["from-date", "to-date"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", load);
  });

  (async function () {
    const auth = await requireRole(["owner", "coach", "head_coach", "assistant_coach"]);
    if (!auth) return;
    isOwner = auth.role === "owner";

    currentUserId = auth.session.user.id;

    document.getElementById("scope-note").innerHTML = isOwner
      ? "Every coach's logged hours. Coaches log practice hours here (or on the <a href=\"admin-attendance.html\">Attendance</a> page when taking roll) and tournament hours on <a href=\"admin-tournament-hours.html\">Tournament Coach Hours</a>."
      : "Your own logged hours &mdash; only you and the club manager can see them. Log practice hours below; tournament hours go on <a href=\"admin-tournament-hours.html\">Tournament Coach Hours</a>.";

    document.getElementById("from-date").value = monthStart();

    const [{ data: profiles }, { data: teams }, { data: rates }] = await Promise.all([
      isOwner
        ? supabaseClient.from("profiles").select("id, full_name, email")
        : Promise.resolve({ data: [{ id: auth.session.user.id, full_name: "You", email: "" }] }),
      supabaseClient.from("schedules").select("team_slug, team_label").order("sort_order", { ascending: true }),
      supabaseClient.from("coach_pay_rates").select("coach_id, hourly_rate_cents"),
    ]);
    (profiles || []).forEach(function (p) { nameById[p.id] = p.full_name || p.email; });
    (teams || []).forEach(function (t) { teamLabels[t.team_slug] = t.team_label; });

    if (!isOwner) {
      // A head coach can only log practice hours for their own team(s).
      let teamOptions = teams || [];
      if (auth.role === "head_coach") {
        const { data: mine } = await supabaseClient.from("head_coach_teams").select("team_slug").eq("profile_id", currentUserId);
        const mySlugs = (mine || []).map(function (r) { return r.team_slug; });
        teamOptions = teamOptions.filter(function (t) { return mySlugs.indexOf(t.team_slug) !== -1; });
      }
      document.getElementById("log-team").innerHTML = '<option value="">Choose a team&hellip;</option>' +
        teamOptions.map(function (t) {
          return '<option value="' + escapeHtml(t.team_slug) + '">' + escapeHtml(t.team_label) + "</option>";
        }).join("");
      document.getElementById("log-date").value = new Date().toLocaleDateString("en-CA");
      document.getElementById("log-form-wrap").style.display = "block";
    }
    (rates || []).forEach(function (r) { rateByCoachId[r.coach_id] = r.hourly_rate_cents; });

    load();
  })();
</script>
</body>
</html>
