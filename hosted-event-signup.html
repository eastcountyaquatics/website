<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Invite | San Diego East County Aquatics</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" href="images/eca-logo.png">
<link rel="apple-touch-icon" href="images/eca-logo.png">
<meta name="theme-color" content="#0a1f6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .invite-card{max-width:560px;margin:0 auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;}
  .invite-price{font-size:32px;font-weight:800;color:var(--blue);margin:6px 0 2px;}
  .lvl-list{display:flex;flex-direction:column;gap:8px;}
  .lvl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid #e3e6f0;border-radius:10px;padding:10px 12px;transition:border-color .15s,background .15s;}
  .lvl-row.on{border-color:var(--blue);background:#f3f7ff;}
  .lvl-pick{display:flex;align-items:center;gap:10px;flex:1;min-width:150px;margin:0;font-weight:700;cursor:pointer;}
  .lvl-pick input{width:20px;height:20px;margin:0;}
  .lvl-price{color:var(--muted);font-size:14px;white-space:nowrap;}
  .lvl-count{display:flex;align-items:center;gap:4px;}
  .lvl-count[hidden]{display:none;}
  .lvl-count input{width:52px;text-align:center;padding:6px 4px;margin:0;}
  .lvl-count button{width:32px;height:32px;border-radius:50%;border:1px solid #cfd6e4;background:#fff;font-size:18px;line-height:1;cursor:pointer;}
  .lvl-total{display:flex;justify-content:space-between;align-items:center;font-size:17px;padding:12px 2px;margin-bottom:6px;border-top:1px solid #eef1f6;}
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img src="images/eca-logo.png" alt="ECA Waterpolo logo" class="logo-mark">
      <span class="brand-text"><strong>East County Aquatics</strong><span>San Diego Water Polo</span></span>
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about-us.html">About Us</a></li>
        <li><a href="teams.html">Teams</a></li>
        <li><a href="masters.html">Masters</a></li>
        <li><a href="junior-olympics.html">Junior Olympics</a></li>
        <li><a href="support.html">Donate/Sponsor</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span></button>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <span class="breadcrumb">Event Invite</span>
    <h1 id="page-title">Event Invite</h1>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="invite-card" id="invite-card">
      <p class="muted">Loading&hellip;</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; <span id="year"></span> San Diego East County Aquatics. All rights reserved.</span>
      <span>Non-profit water polo club &middot; El Cajon, CA</span>
    </div>
  </div>
</footer>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/fn-error.js"></script>
<script src="js/main.js"></script>
<script>
  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function formatAmount(cents) {
    return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format((cents || 0) / 100);
  }
  function formatDate(iso) {
    if (!iso) return "";
    return new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const checkoutStatus = params.get("checkout");
  const cardEl = document.getElementById("invite-card");

  function renderError(message) {
    cardEl.innerHTML = "<p>" + escapeHtml(message) + "</p>";
  }

  async function init() {
    if (!token) {
      renderError("This link is missing its invite code. Please use the exact link you were sent.");
      return;
    }

    const { data, error } = await supabaseClient.functions.invoke("get-hosted-event-invite", { body: { token: token } });
    if (error || !data || data.error) {
      renderError(await functionErrorMessage(error, data, "This invite link could not be loaded. Please contact the club."));
      return;
    }

    document.getElementById("page-title").textContent = data.event.name;
    document.title = data.event.name + " Invite | San Diego East County Aquatics";

    if (checkoutStatus === "success" || data.status === "paid") {
      cardEl.innerHTML =
        "<h3>You're registered!</h3>" +
        "<p class=\"muted\">" + escapeHtml(data.team_name || "Your team") + " is signed up for " + escapeHtml(data.event.name) + ". A receipt was sent to your email.</p>" +
        ((data.registered_teams || []).filter(function (t) { return t.level !== "Team"; }).length
          ? '<ul class="muted" style="margin:0 0 12px 18px;">' + data.registered_teams.map(function (t) {
              return "<li>" + escapeHtml(t.level) + (t.count > 1 ? " &times; " + t.count : "") + "</li>";
            }).join("") + "</ul>"
          : "") +
        (data.event.schedule_url ? '<p class="muted"><a href="' + escapeHtml(data.event.schedule_url) + '" target="_blank" rel="noopener">View the current schedule</a> &mdash; check back, it may be updated closer to the event.</p>' : "");
      return;
    }
    if (data.closed_reason) {
      cardEl.innerHTML =
        "<h3>" + escapeHtml(data.team_name || data.event.name) + "</h3>" +
        '<p class="muted"><strong>Date:</strong> ' + formatDate(data.event.event_date) + "</p>" +
        '<div class="form-msg error" style="display:block;">' + escapeHtml(data.closed_reason) + "</div>" +
        (data.event.schedule_url ? '<p class="muted" style="margin-top:10px;"><a href="' + escapeHtml(data.event.schedule_url) + '" target="_blank" rel="noopener">View the schedule</a></p>' : "");
      return;
    }

    if (checkoutStatus === "cancelled") {
      cardEl.innerHTML =
        '<div class="notice" style="margin-bottom:20px;">Checkout was cancelled — no payment was made. You can try again below.</div>';
    } else {
      cardEl.innerHTML = "";
    }

    function formatEventDates(ev) {
      var extra = (ev.additional_dates || []).slice().sort();
      if (ev.end_date && ev.end_date !== ev.event_date) return formatDate(ev.event_date) + " – " + formatDate(ev.end_date);
      if (extra.length) return [ev.event_date].concat(extra).map(formatDate).join(", ");
      return formatDate(ev.event_date);
    }

    const ev = data.event;
    // The age groups a club can sign teams up for, each with its price per
    // team (one fee for all, or its own price when priced by age group).
    function priceFor(level) {
      if (!ev.price_by_level) return ev.fee_cents;
      const row = (ev.level_prices || []).find(function (p) { return p.level === level; });
      return row ? row.fee_cents : null;
    }
    const options = ((ev.levels && ev.levels.length) ? ev.levels : ["Team"])
      .filter(function (l) { return priceFor(l) > 0; });
    if (!options.length) {
      renderError("Signup for this event isn't open yet. Please contact the club at eastcountyaquatics@gmail.com.");
      return;
    }
    const prices = options.map(priceFor);
    const minPrice = Math.min.apply(null, prices), maxPrice = Math.max.apply(null, prices);

    const infoWrap = document.createElement("div");
    infoWrap.innerHTML =
      "<h3>" + escapeHtml(data.team_name || ev.name) + "</h3>" +
      (ev.description ? '<p class="muted">' + escapeHtml(ev.description) + "</p>" : "") +
      '<p class="muted"><strong>Date:</strong> ' + formatEventDates(ev) + "</p>" +
      (ev.location ? '<p class="muted"><strong>Location:</strong> ' + escapeHtml(ev.location) + "</p>" : "") +
      (ev.schedule_url ? '<p class="muted"><strong>Schedule:</strong> <a href="' + escapeHtml(ev.schedule_url) + '" target="_blank" rel="noopener">View current schedule</a></p>' : "") +
      '<div class="invite-price">' + (minPrice === maxPrice ? formatAmount(minPrice) : formatAmount(minPrice) + "&ndash;" + formatAmount(maxPrice)) + "</div>" +
      '<p class="muted" style="margin-bottom:20px;">Per team' + (minPrice === maxPrice ? "" : ", depending on age group") + "</p>";
    cardEl.appendChild(infoWrap);

    // What they picked last time (e.g. back from a cancelled checkout).
    const before = {};
    (data.registered_teams || []).forEach(function (t) { before[t.level] = t.count; });
    const single = options.length === 1 && options[0] === "Team";

    // Teams invited by email only haven't given a team name yet.
    const needsTeamName = !String(data.team_name || "").trim();
    const form = document.createElement("form");
    form.id = "invite-form";
    form.innerHTML =
      (needsTeamName ? '<div class="field"><label for="team_name">Team / Club Name</label><input type="text" id="team_name" maxlength="200" required></div>' : "") +
      '<div class="field"><label>' + (single ? "How many teams?" : "Which teams are you bringing?") + "</label>" +
      (single ? "" : '<p class="muted" style="font-size:13px;margin:-2px 0 8px;">Check each age group, and how many teams you’re bringing in it.</p>') +
      '<div class="lvl-list">' + options.map(function (level, i) {
        const count = before[level] || (single ? 1 : 0);
        return '<div class="lvl-row' + (count ? " on" : "") + '">' +
          '<label class="lvl-pick"><input type="checkbox" data-level-index="' + i + '"' + (count ? " checked" : "") + (single ? ' hidden' : "") + "> " +
          '<span class="lvl-name">' + escapeHtml(single ? "Teams" : level) + "</span></label>" +
          '<span class="lvl-price">' + formatAmount(priceFor(level)) + " / team</span>" +
          '<span class="lvl-count"' + (count ? "" : " hidden") + '><button type="button" data-step="-1" data-for="' + i + '" aria-label="Fewer teams">&minus;</button>' +
          '<input type="number" min="1" max="10" value="' + (count || 1) + '" data-count-index="' + i + '" aria-label="Number of ' + escapeHtml(level) + ' teams">' +
          '<button type="button" data-step="1" data-for="' + i + '" aria-label="More teams">+</button></span>' +
          "</div>";
      }).join("") + "</div></div>" +
      '<div class="lvl-total" id="lvl-total"></div>' +
      '<div class="field"><label for="contact_email">Contact Email</label><input type="email" id="contact_email" required></div>' +
      '<div id="invite-msg" class="form-msg"></div>' +
      '<button type="submit" class="btn btn-primary" style="width:100%;" id="pay-btn">Pay</button>';
    cardEl.appendChild(form);

    function picked() {
      return options.map(function (level, i) {
        const on = form.querySelector('[data-level-index="' + i + '"]').checked;
        const n = Math.max(1, Math.min(10, parseInt(form.querySelector('[data-count-index="' + i + '"]').value, 10) || 1));
        return on ? { level: level, count: n } : null;
      }).filter(Boolean);
    }
    function refresh() {
      const teams = picked();
      const total = teams.reduce(function (sum, t) { return sum + priceFor(t.level) * t.count; }, 0);
      const n = teams.reduce(function (sum, t) { return sum + t.count; }, 0);
      document.getElementById("lvl-total").innerHTML = n
        ? "<span>" + n + " team" + (n === 1 ? "" : "s") + "</span><strong>" + formatAmount(total) + "</strong>"
        : '<span class="muted">Pick at least one team.</span>';
      const btn = document.getElementById("pay-btn");
      btn.disabled = !n;
      btn.textContent = n ? "Pay " + formatAmount(total) : "Pay";
    }
    form.addEventListener("change", function (e) {
      const cb = e.target.closest("[data-level-index]");
      if (cb) {
        const row = cb.closest(".lvl-row");
        row.classList.toggle("on", cb.checked);
        row.querySelector(".lvl-count").hidden = !cb.checked;
      }
      refresh();
    });
    form.addEventListener("input", refresh);
    form.addEventListener("click", function (e) {
      const step = e.target.closest("[data-step]");
      if (!step) return;
      const input = form.querySelector('[data-count-index="' + step.dataset.for + '"]');
      input.value = Math.max(1, Math.min(10, (parseInt(input.value, 10) || 1) + parseInt(step.dataset.step, 10)));
      refresh();
    });
    refresh();

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const msg = document.getElementById("invite-msg");
      msg.className = "form-msg";
      const teams = picked();
      if (!teams.length) {
        msg.className = "form-msg error";
        msg.textContent = "Pick at least one team to sign up.";
        return;
      }
      const submitBtn = document.getElementById("pay-btn");
      const label = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = "Redirecting to payment...";

      const payload = {
        token: token,
        contact_email: document.getElementById("contact_email").value.trim(),
        team_name: needsTeamName ? document.getElementById("team_name").value.trim() : undefined,
        teams: teams,
      };

      const { data: checkoutData, error: checkoutError } = await supabaseClient.functions.invoke("create-hosted-event-checkout", { body: payload });

      if (checkoutError || !checkoutData || !checkoutData.url) {
        submitBtn.disabled = false;
        submitBtn.textContent = label;
        msg.className = "form-msg error";
        msg.textContent = await functionErrorMessage(checkoutError, checkoutData, "Could not start checkout. Please try again.");
        return;
      }

      window.location.href = checkoutData.url;
    });
  }

  init();
</script>
</body>
</html>
