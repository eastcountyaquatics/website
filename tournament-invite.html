<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Invite | San Diego East County Aquatics</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" href="images/eca-logo.png">
<link rel="apple-touch-icon" href="images/eca-logo.png">
<meta name="theme-color" content="#0a1f6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .invite-card{max-width:560px;margin:0 auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;}
  .invite-price{font-size:32px;font-weight:800;color:var(--blue);margin:6px 0 2px;}
  .pay-step{border:1px solid #e3edf3;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pay-step .num{font-weight:800;color:var(--blue);min-width:18px;}
  .pay-step .val{font-size:20px;font-weight:800;letter-spacing:.5px;flex:1;min-width:140px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img src="images/eca-logo.png" alt="ECA Waterpolo logo" class="logo-mark">
      <span class="brand-text"><strong>East County Aquatics</strong><span>San Diego Water Polo</span></span>
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about-us.html">About Us</a></li>
        <li><a href="teams.html">Teams</a></li>
        <li><a href="masters.html">Masters</a></li>
        <li><a href="junior-olympics.html">Junior Olympics</a></li>
        <li><a href="support.html">Donate/Sponsor</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span></button>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <span class="breadcrumb">Tournament Invite</span>
    <h1 id="page-title">Tournament Invite</h1>
  </div>
</section>

<section class="section-tight">
  <div class="container">
    <div class="invite-card" id="invite-card">
      <p class="muted">Loading&hellip;</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; <span id="year"></span> San Diego East County Aquatics. All rights reserved.</span>
      <span>Non-profit water polo club &middot; El Cajon, CA</span>
    </div>
  </div>
</footer>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/fn-error.js"></script>
<script src="js/main.js"></script>
<script>
  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function formatAmount(cents) {
    return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format((cents || 0) / 100);
  }
  function formatDate(iso) {
    if (!iso) return "";
    return new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const checkoutStatus = params.get("checkout");
  const cardEl = document.getElementById("invite-card");

  function renderError(message) {
    cardEl.innerHTML = "<p>" + escapeHtml(message) + "</p>";
  }

  async function init() {
    if (!token) {
      renderError("This link is missing its invite code. Please use the exact link the club sent you.");
      return;
    }

    const { data, error } = await supabaseClient.functions.invoke("get-tournament-invite", { body: { token: token } });
    if (error || !data || data.error) {
      renderError(await functionErrorMessage(error, data, "This invite link could not be loaded. Please contact the club."));
      return;
    }

    data_athlete_name = data.athlete.full_name;
    document.getElementById("page-title").textContent = data.tournament.name;
    document.title = data.tournament.name + " Invite | San Diego East County Aquatics";

    if (checkoutStatus === "success" || data.status === "paid") {
      cardEl.innerHTML =
        "<h3>You're registered!</h3>" +
        "<p class=\"muted\">" + escapeHtml(data.athlete.full_name) + " is signed up for " + escapeHtml(data.tournament.name) + ". A receipt was sent to your email.</p>";
      return;
    }
    // Payment cutoff passed, event over, or tournament not published yet:
    // show why rather than a Pay button that checkout will refuse.
    if (data.closed_reason) {
      cardEl.innerHTML =
        "<h3>" + escapeHtml(data.athlete.full_name) + "</h3>" +
        '<p class="muted"><strong>Date:</strong> ' + formatDate(data.tournament.event_date) + "</p>" +
        '<div class="form-msg error" style="display:block;">' + escapeHtml(data.closed_reason) + "</div>" +
        '<p class="muted" style="margin-top:16px;">Questions? <a href="contact.html">Get in touch with the club.</a></p>';
      return;
    }

    if (checkoutStatus === "cancelled") {
      cardEl.innerHTML =
        '<div class="notice" style="margin-bottom:20px;">Checkout was cancelled — no payment was made. You can try again below.</div>';
    } else {
      cardEl.innerHTML = "";
    }

    const infoWrap = document.createElement("div");
    infoWrap.innerHTML =
      "<h3>" + escapeHtml(data.athlete.full_name) + "</h3>" +
      (data.tournament.description ? '<p class="muted">' + escapeHtml(data.tournament.description) + "</p>" : "") +
      '<p class="muted"><strong>Date:</strong> ' + formatDate(data.tournament.event_date) + "</p>" +
      (data.tournament.rsvp_deadline
        ? '<p class="muted"><strong>Pay by:</strong> ' + formatDate(data.tournament.rsvp_deadline) +
          " — only athletes paid by this date are on the official roster.</p>"
        : "") +
      (data.tournament.location ? '<p class="muted"><strong>Location:</strong> ' + escapeHtml(data.tournament.location) + "</p>" : "") +
      (data.tournament.hotel_name
        ? '<p class="muted"><strong>Hotel:</strong> ' + (data.tournament.hotel_url
            ? '<a href="' + escapeHtml(data.tournament.hotel_url) + '" target="_blank" rel="noopener">' + escapeHtml(data.tournament.hotel_name) + "</a>"
            : escapeHtml(data.tournament.hotel_name)) + "</p>"
        : "") +
      (data.tournament.requirements ? '<p class="muted"><strong>Requirements:</strong> ' + escapeHtml(data.tournament.requirements) + "</p>" : "") +
      '<div class="invite-price">' + formatAmount(data.tier.amount_cents) + "</div>" +
      '<p class="muted" style="margin-bottom:20px;">' + escapeHtml(data.tier.label) + "</p>";
    cardEl.appendChild(infoWrap);

    if (data.payment_provider === "zeffy") {
      renderZeffy(data);
      return;
    }

    const form = document.createElement("form");
    form.id = "invite-form";
    form.innerHTML =
      '<div class="field"><label for="payer_name">Your Name</label><input type="text" id="payer_name" required></div>' +
      '<div class="field"><label for="payer_email">Your Email</label><input type="email" id="payer_email" required></div>' +
      (data.tournament.shirt_size_enabled
        ? '<div class="field"><label for="shirt_size">Shirt Size</label>' +
          '<select id="shirt_size"><option value="">Select one...</option>' +
          "<option>Youth Small</option><option>Youth Medium</option><option>Youth Large</option>" +
          "<option>Adult Small</option><option>Adult Medium</option><option>Adult Large</option><option>Adult XL</option>" +
          "</select></div>"
        : "") +
      '<div class="field"><label for="discount_code">Discount Code (optional)</label><input type="text" id="discount_code" style="text-transform:uppercase;"></div>' +
      '<div id="invite-msg" class="form-msg"></div>' +
      '<button type="submit" class="btn btn-primary" style="width:100%;">Pay ' + formatAmount(data.tier.amount_cents) + "</button>";
    cardEl.appendChild(form);

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const msg = document.getElementById("invite-msg");
      msg.className = "form-msg";
      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "Redirecting to payment...";

      const payload = {
        token: token,
        payer_name: document.getElementById("payer_name").value.trim(),
        payer_email: document.getElementById("payer_email").value.trim(),
      };
      const shirtSizeEl = document.getElementById("shirt_size");
      if (shirtSizeEl) payload.shirt_size = shirtSizeEl.value;
      const discountCode = document.getElementById("discount_code").value.trim();
      if (discountCode) payload.discount_code = discountCode;

      const { data: checkoutData, error: checkoutError } = await supabaseClient.functions.invoke("create-tournament-checkout", { body: payload });

      if (checkoutError || !checkoutData || !checkoutData.url) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Pay " + formatAmount(data.tier.amount_cents);
        msg.className = "form-msg error";
        msg.textContent = await functionErrorMessage(checkoutError, checkoutData, "Could not start checkout. Please try again.");
        return;
      }

      window.location.href = checkoutData.url;
    });
  }

  // Zeffy tournaments: the site works out the price (and discount code),
  // then the family pays it on the club's Zeffy form with their code.
  function renderZeffy(data) {
    if (data.pay_link && data.pay_link.status === "short") {
      const note = document.createElement("div");
      note.className = "notice";
      note.style.marginBottom = "16px";
      note.innerHTML = "We received " + formatAmount(data.pay_link.paid_cents) + " of " + formatAmount(data.pay_link.amount_due_cents) +
        ". <strong>" + escapeHtml(data.athlete.full_name) + " isn't on the roster until the " + formatAmount(data.pay_link.balance_cents) +
        " balance is paid.</strong>";
      cardEl.appendChild(note);
      requestPayLink({ token: token }, null);
      return;
    }

    const form = document.createElement("form");
    form.id = "invite-form";
    form.innerHTML =
      '<div class="field"><label for="payer_name">Your Name</label><input type="text" id="payer_name" required></div>' +
      '<div class="field"><label for="payer_email">Your Email</label><input type="email" id="payer_email" required></div>' +
      (data.tournament.shirt_size_enabled
        ? '<div class="field"><label for="shirt_size">Shirt Size</label>' +
          '<select id="shirt_size"><option value="">Select one...</option>' +
          "<option>Youth Small</option><option>Youth Medium</option><option>Youth Large</option>" +
          "<option>Adult Small</option><option>Adult Medium</option><option>Adult Large</option><option>Adult XL</option>" +
          "</select></div>"
        : "") +
      '<div class="field"><label for="discount_code">Discount Code (optional)</label><input type="text" id="discount_code" style="text-transform:uppercase;">' +
      '<p class="muted" style="font-size:12px;margin-top:4px;">Only if the club gave you a discount. Leave blank otherwise &mdash; your payment code comes on the next screen.</p></div>' +
      '<div id="invite-msg" class="form-msg"></div>' +
      '<button type="submit" class="btn btn-primary" style="width:100%;">Continue to Payment</button>';
    cardEl.appendChild(form);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const payload = {
        token: token,
        payer_name: document.getElementById("payer_name").value.trim(),
        payer_email: document.getElementById("payer_email").value.trim(),
      };
      const shirtSizeEl = document.getElementById("shirt_size");
      if (shirtSizeEl) payload.shirt_size = shirtSizeEl.value;
      const discountCode = document.getElementById("discount_code").value.trim();
      if (discountCode) payload.discount_code = discountCode;
      requestPayLink(payload, form);
    });
  }

  async function requestPayLink(payload, form) {
    const msg = form ? document.getElementById("invite-msg") : null;
    const submitBtn = form ? form.querySelector("button[type=submit]") : null;
    if (msg) msg.className = "form-msg";
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Getting your payment code..."; }

    const { data: link, error } = await supabaseClient.functions.invoke("create-zeffy-pay-link", { body: payload });
    if (error || !link || !link.code) {
      const text = await functionErrorMessage(error, link, "Could not get your payment code. Please try again.");
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = "Continue to Payment"; }
      if (msg) { msg.className = "form-msg error"; msg.textContent = text; }
      else renderError(text);
      return;
    }
    if (form) form.remove();

    if (link.free) {
      cardEl.innerHTML = "<h3>You're registered!</h3><p class=\"muted\">Your discount code covered the full amount &mdash; nothing to pay.</p>";
      return;
    }

    const amount = formatAmount(link.balance_cents);
    const box = document.createElement("div");
    box.innerHTML =
      '<h3 style="margin-top:4px;">Pay ' + amount + " on Zeffy</h3>" +
      '<p class="muted">The club takes payments through Zeffy, which charges the club no fees. Copy these two things, then open the payment page:</p>' +
      '<div class="pay-step"><span class="num">1</span><div style="flex:1;"><div class="muted" style="font-size:13px;">Amount to enter</div><div class="val">' + amount + "</div></div>" +
      '<button type="button" class="btn btn-outline-dark" style="padding:6px 14px;" data-copy="' + escapeHtml((link.balance_cents / 100).toFixed(2)) + '">Copy</button></div>' +
      '<div class="pay-step"><span class="num">2</span><div style="flex:1;"><div class="muted" style="font-size:13px;">Payment code (paste into the &ldquo;Payment code&rdquo; question)</div><div class="val">' + escapeHtml(link.code) + "</div></div>" +
      '<button type="button" class="btn btn-outline-dark" style="padding:6px 14px;" data-copy="' + escapeHtml(link.code) + '">Copy</button></div>' +
      '<a class="btn btn-primary" style="width:100%;text-align:center;margin:8px 0 12px;" href="' + escapeHtml(link.form_url) + '" target="_blank" rel="noopener">3. Open the Zeffy Payment Page</a>' +
      '<p class="muted" style="font-size:13px;">Zeffy will suggest an optional tip to Zeffy (not the club). You can change it to $0.</p>' +
      '<p class="muted" style="font-size:13px;">Enter exactly <strong>' + amount + "</strong> &mdash; " + escapeHtml(data_athlete_name) +
      " is added to the roster once the full amount comes in. Paid? This page updates within a minute or two.</p>" +
      '<button type="button" class="btn btn-outline-dark" style="width:100%;" id="check-paid">I\'ve Paid &mdash; Check Status</button>';
    cardEl.appendChild(box);

    box.addEventListener("click", async function (e) {
      const copyBtn = e.target.closest("[data-copy]");
      if (copyBtn) {
        try {
          await navigator.clipboard.writeText(copyBtn.dataset.copy);
          copyBtn.textContent = "Copied";
        } catch (err) {
          copyBtn.textContent = copyBtn.dataset.copy;
        }
        setTimeout(function () { copyBtn.textContent = "Copy"; }, 2000);
        return;
      }
      if (e.target.id === "check-paid") window.location.reload();
    });
  }

  let data_athlete_name = "Your athlete";

  init();
</script>
</body>
</html>
