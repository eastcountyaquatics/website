<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Invite | San Diego East County Aquatics</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/styles.css?v=20261022c">
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" href="images/eca-logo-240.png">
<link rel="apple-touch-icon" href="images/eca-logo-240.png">
<meta name="theme-color" content="#0a1f6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .invite-card{max-width:560px;margin:0 auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;}
  .invite-price{font-size:32px;font-weight:800;color:var(--blue);margin:6px 0 2px;}
  .pay-step{border:1px solid #e3edf3;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pay-step .num{font-weight:800;color:var(--blue);min-width:18px;}
  .pay-step .val{font-size:20px;font-weight:800;letter-spacing:.5px;flex:1;min-width:140px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img src="images/eca-logo-240.png" alt="ECA Waterpolo logo" class="logo-mark" width="240" height="240">
      <span class="brand-text"><strong>East County Aquatics</strong><span>San Diego Water Polo</span></span>
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about-us.html">About Us</a></li>
        <li><a href="teams.html">Teams</a></li>
        <li><a href="masters.html">Masters</a></li>
        <li><a href="junior-olympics.html">Junior Olympics</a></li>
        <li><a href="eca-gear.html">Team Store</a></li>
        <li><a href="support.html">Donate/Sponsor</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span></button>
  </div>
</header>

<section data-section="tournament-invite-1" class="page-hero">
  <div class="container">
    <span data-cms="tournament-invite-0001" class="breadcrumb">Tournament Invite</span>
    <h1 id="page-title">Tournament Invite</h1>
  </div>
</section>

<section data-section="tournament-invite-2" class="section-tight">
  <div class="container">
    <div class="invite-card" id="invite-card">
      <p class="muted">Loading&hellip;</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; <span id="year"></span> San Diego East County Aquatics. All rights reserved.</span>
      <span>Non-profit water polo club &middot; El Cajon, CA</span>
    </div>
  </div>
</footer>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/site-text.js?v=20261022"></script>
<script src="js/fn-error.js"></script>
<script src="js/main.js?v=20261014p"></script>
<script src="js/site-chrome.js?v=20261014p"></script>
<script src="js/sanitize-html.js"></script>
<script src="js/content-blocks.js?v=20261021"></script>
<script src="js/image-blocks.js?v=20261021"></script>
<script src="js/link-blocks.js?v=20261021"></script>
<script>
  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function formatAmount(cents) {
    return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format((cents || 0) / 100);
  }
  function formatDate(iso) {
    if (!iso) return "";
    return new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const checkoutStatus = params.get("checkout");
  const cardEl = document.getElementById("invite-card");

  // Payments made on this invite, each with its Zeffy receipt when there is
  // one (card payments' receipts come by email from Stripe).
  function paymentsHtml(payments) {
    if (!payments || !payments.length) return "";
    return '<div style="margin:12px 0 16px;"><div class="muted" style="font-size:13px;font-weight:700;margin-bottom:6px;">Payments</div>' +
      payments.map(function (p) {
        const safeReceipt = p.receipt_url && /^https:\/\//.test(p.receipt_url);
        return '<div style="display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eef1f6;padding:8px 0;font-size:14px;">' +
          "<span>" + formatDate(String(p.paid_at).slice(0, 10)) + " &middot; " + formatAmount(p.amount_cents) + "</span>" +
          (safeReceipt
            ? '<a href="' + escapeHtml(p.receipt_url) + '" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700;text-decoration:underline;">View receipt</a>'
            : '<span class="muted">' + (p.via === "stripe" ? "Receipt emailed" : "Receipt pending") + "</span>") +
          "</div>";
      }).join("") + "</div>";
  }

  function renderError(message) {
    cardEl.innerHTML = "<p>" + escapeHtml(message) + "</p>";
  }

  async function init() {
    if (!token) {
      renderError("This link is missing its invite code. Please use the exact link the club sent you.");
      return;
    }

    const { data, error } = await supabaseClient.functions.invoke("get-tournament-invite", { body: { token: token } });
    if (error || !data || data.error) {
      renderError(await functionErrorMessage(error, data, "This invite link could not be loaded. Please contact the club."));
      return;
    }

    data_athlete_name = data.athlete.full_name;
    document.getElementById("page-title").textContent = data.tournament.name;
    document.title = data.tournament.name + " Invite | San Diego East County Aquatics";

    if (checkoutStatus === "success" || data.status === "paid") {
      cardEl.innerHTML =
        "<h3>You're registered!</h3>" +
        "<p class=\"muted\">" + escapeHtml(data.athlete.full_name) + " is signed up for " + escapeHtml(data.tournament.name) + ". A receipt was sent to your email.</p>" +
        paymentsHtml(data.payments);
      return;
    }
    // Payment cutoff passed, event over, or tournament not published yet:
    // show why rather than a Pay button that checkout will refuse.
    if (data.closed_reason) {
      cardEl.innerHTML =
        "<h3>" + escapeHtml(data.athlete.full_name) + "</h3>" +
        '<p class="muted"><strong>Date:</strong> ' + formatDate(data.tournament.event_date) + "</p>" +
        '<div class="form-msg error" style="display:block;">' + escapeHtml(data.closed_reason) + "</div>" +
        '<p class="muted" style="margin-top:16px;">Questions? <a href="contact.html">Get in touch with the club.</a></p>';
      return;
    }

    if (checkoutStatus === "cancelled") {
      cardEl.innerHTML =
        '<div class="notice" style="margin-bottom:20px;">Checkout was cancelled — no payment was made. You can try again below.</div>';
    } else {
      cardEl.innerHTML = "";
    }

    const infoWrap = document.createElement("div");
    infoWrap.innerHTML =
      "<h3>" + escapeHtml(data.athlete.full_name) + "</h3>" +
      (data.tournament.description ? '<p class="muted">' + escapeHtml(data.tournament.description) + "</p>" : "") +
      '<p class="muted"><strong>Date:</strong> ' + formatDate(data.tournament.event_date) + "</p>" +
      (data.tournament.rsvp_deadline
        ? '<p class="muted"><strong>Pay by:</strong> ' + formatDate(data.tournament.rsvp_deadline) +
          " — only athletes paid by this date are on the official roster.</p>"
        : "") +
      (data.tournament.location ? '<p class="muted"><strong>Location:</strong> ' + escapeHtml(data.tournament.location) + "</p>" : "") +
      (data.tournament.hotel_name
        ? '<p class="muted"><strong>Hotel:</strong> ' + (data.tournament.hotel_url
            ? '<a href="' + escapeHtml(data.tournament.hotel_url) + '" target="_blank" rel="noopener">' + escapeHtml(data.tournament.hotel_name) + "</a>"
            : escapeHtml(data.tournament.hotel_name)) + "</p>"
        : "") +
      (data.tournament.requirements ? '<p class="muted"><strong>Requirements:</strong> ' + escapeHtml(data.tournament.requirements) + "</p>" : "") +
      '<div class="invite-price">' + formatAmount(data.tier.amount_cents) + "</div>" +
      '<p class="muted" style="margin-bottom:20px;">' + escapeHtml(data.tier.label) + "</p>";
    cardEl.appendChild(infoWrap);

    if (data.payment_provider === "zeffy") {
      renderZeffy(data);
      return;
    }

    const form = document.createElement("form");
    form.id = "invite-form";
    form.innerHTML =
      '<div class="field"><label for="payer_name">Your Name</label><input type="text" id="payer_name" required></div>' +
      '<div class="field"><label for="payer_email">Your Email</label><input type="email" id="payer_email" required></div>' +
      (data.tournament.shirt_size_enabled
        ? '<div class="field"><label for="shirt_size">Shirt Size</label>' +
          '<select id="shirt_size"><option value="">Select one...</option>' +
          "<option>Youth Small</option><option>Youth Medium</option><option>Youth Large</option>" +
          "<option>Adult Small</option><option>Adult Medium</option><option>Adult Large</option><option>Adult XL</option>" +
          "</select></div>"
        : "") +
      '<div class="field"><label for="discount_code">Discount Code (optional)</label><input type="text" id="discount_code" style="text-transform:uppercase;"></div>' +
      '<div id="invite-msg" class="form-msg"></div>' +
      '<button type="submit" class="btn btn-primary" style="width:100%;">Pay ' + formatAmount(data.tier.amount_cents) + "</button>";
    cardEl.appendChild(form);

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const msg = document.getElementById("invite-msg");
      msg.className = "form-msg";
      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "Redirecting to payment...";

      const payload = {
        token: token,
        payer_name: document.getElementById("payer_name").value.trim(),
        payer_email: document.getElementById("payer_email").value.trim(),
      };
      const shirtSizeEl = document.getElementById("shirt_size");
      if (shirtSizeEl) payload.shirt_size = shirtSizeEl.value;
      const discountCode = document.getElementById("discount_code").value.trim();
      if (discountCode) payload.discount_code = discountCode;

      const { data: checkoutData, error: checkoutError } = await supabaseClient.functions.invoke("create-tournament-checkout", { body: payload });

      if (checkoutError || !checkoutData || !checkoutData.url) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Pay " + formatAmount(data.tier.amount_cents);
        msg.className = "form-msg error";
        msg.textContent = await functionErrorMessage(checkoutError, checkoutData, "Could not start checkout. Please try again.");
        return;
      }

      window.location.href = checkoutData.url;
    });
  }

  // Zeffy tournaments: the site works out the price (and any discount code),
  // then the family pays it on the club's Zeffy form with their payment
  // code. The invite is already for one athlete and Zeffy collects the
  // payer's name and email, so nothing to fill in here but a shirt size
  // (when the tournament asks) or a discount code (if they have one).
  let payBoxEl = null;
  let chosenShirtSize = null;

  function renderZeffy(data) {
    // Same shape as the card flow: details, then a Pay button. Tapping it
    // shows the amount to enter and the family's payment code.
    const short = data.pay_link && data.pay_link.status === "short";
    if (short) {
      const note = document.createElement("div");
      note.className = "notice";
      note.style.marginBottom = "16px";
      note.innerHTML = "We received " + formatAmount(data.pay_link.paid_cents) + " of " + formatAmount(data.pay_link.amount_due_cents) +
        ". <strong>" + escapeHtml(data.athlete.full_name) + " isn't on the roster until the " + formatAmount(data.pay_link.balance_cents) +
        " balance is paid.</strong>";
      cardEl.appendChild(note);
      const history = document.createElement("div");
      history.innerHTML = paymentsHtml(data.payments);
      cardEl.appendChild(history);
    }

    const payAmount = short ? data.pay_link.balance_cents
      : (data.pay_link && data.pay_link.status === "open" ? data.pay_link.amount_due_cents : data.tier.amount_cents);
    const payLabel = short ? "Pay " + formatAmount(payAmount) + " Balance" : "Pay " + formatAmount(payAmount);

    const form = document.createElement("form");
    form.id = "invite-form";
    form.innerHTML =
      (!short && data.tournament.shirt_size_enabled
        ? '<div class="field"><label for="shirt_size">Shirt Size</label>' +
          '<select id="shirt_size" required><option value="">Select one...</option>' +
          "<option>Youth Small</option><option>Youth Medium</option><option>Youth Large</option>" +
          "<option>Adult Small</option><option>Adult Medium</option><option>Adult Large</option><option>Adult XL</option>" +
          "</select></div>"
        : "") +
      // Set-price forms take discount codes on Zeffy itself.
      (!short && !data.tournament.zeffy_set_price
        ? '<div class="field"><label for="discount_code">Discount Code (optional)</label><input type="text" id="discount_code" style="text-transform:uppercase;"></div>'
        : "") +
      '<div id="invite-msg" class="form-msg"></div>' +
      '<button type="submit" class="btn btn-primary" style="width:100%;">' + payLabel + "</button>";
    cardEl.appendChild(form);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const payload = { token: token };
      const shirtSizeEl = document.getElementById("shirt_size");
      if (shirtSizeEl) { chosenShirtSize = shirtSizeEl.value; payload.shirt_size = chosenShirtSize; }
      const discountEl = document.getElementById("discount_code");
      if (discountEl && discountEl.value.trim()) payload.discount_code = discountEl.value.trim();
      requestPayLink(payload, form, false);
    });
  }

  async function requestPayLink(payload, form, allowDiscount) {
    const msg = form ? document.getElementById("invite-msg") : document.getElementById("discount-msg");
    const submitBtn = form ? form.querySelector("button[type=submit]") : document.getElementById("discount-apply");
    const idleLabel = submitBtn ? submitBtn.textContent : "";
    if (msg) msg.className = "form-msg";
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "One moment..."; }

    const { data: link, error } = await supabaseClient.functions.invoke("create-zeffy-pay-link", { body: payload });
    if (error || !link || !link.code) {
      const text = await functionErrorMessage(error, link, "Could not get your payment code. Please try again.");
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = idleLabel; }
      if (msg) { msg.className = "form-msg error"; msg.textContent = text; }
      else renderError(text);
      return;
    }
    if (form) form.remove();
    if (payBoxEl) payBoxEl.remove();

    if (link.free) {
      cardEl.innerHTML = "<h3>" + ecaT("ti.free_title") + "</h3><p class=\"muted\">" + ecaT("ti.free") + "</p>";
      return;
    }

    const amount = formatAmount(link.balance_cents);
    const box = document.createElement("div");
    // The tournament's own Zeffy form has a ticket per price: copy the code,
    // pick the ticket, paste the code. Nothing to type for the amount.
    if (link.set_price) {
      box.innerHTML =
        '<h3 style="margin-top:4px;">' + ecaT("ti.set_title") + '</h3>' +
        '<p class="muted">' + ecaT("ti.intro_set") + '</p>' +
        '<div class="pay-step"><span class="num">1</span><div style="flex:1;"><div class="muted" style="font-size:13px;">' + ecaT("ti.step_code") + '</div><div class="val">' + escapeHtml(link.code) + "</div></div>" +
        '<button type="button" class="btn btn-outline-dark" style="padding:6px 14px;" data-copy="' + escapeHtml(link.code) + '">Copy</button></div>' +
        '<div class="pay-step"><span class="num">2</span><div style="flex:1;"><div class="muted" style="font-size:13px;">' + ecaT("ti.step_ticket") + '</div><div class="val">' +
          escapeHtml(link.tier_label || "") + " &mdash; " + amount + "</div></div></div>" +
        '<div class="pay-step"><span class="num">3</span><div style="flex:1;font-size:14px;">' + ecaT("ti.step_paste") + '</div></div>' +
        '<a class="btn btn-primary" style="width:100%;text-align:center;margin:8px 0 12px;" href="' + escapeHtml(link.form_url) + '" target="_blank" rel="noopener">' + ecaT("ti.open_set") + '</a>' +
        '<p class="muted" style="font-size:13px;">' + ecaT("ti.multi") + " " + ecaT("zeffy.tip") + '</p>' +
        '<p class="muted" style="font-size:13px;">' + ecaT("ti.roster_set", { athlete: escapeHtml(data_athlete_name) }) + "</p>" +
        '<button type="button" class="btn btn-outline-dark" style="width:100%;" id="check-paid">' + ecaT("ti.check_btn") + '</button>';
    } else box.innerHTML =
      '<h3 style="margin-top:4px;">' + ecaT("ti.club_title", { amount: amount }) + "</h3>" +
      '<p class="muted">' + ecaT("ti.intro_club") + '</p>' +
      '<div class="pay-step"><span class="num">1</span><div style="flex:1;"><div class="muted" style="font-size:13px;">' + ecaT("ti.step_amount") + '</div><div class="val">' + amount + "</div></div>" +
      '<button type="button" class="btn btn-outline-dark" style="padding:6px 14px;" data-copy="' + escapeHtml((link.balance_cents / 100).toFixed(2)) + '">Copy</button></div>' +
      '<div class="pay-step"><span class="num">2</span><div style="flex:1;"><div class="muted" style="font-size:13px;">' + ecaT("ti.step_code_club") + '</div><div class="val">' + escapeHtml(link.code) + "</div></div>" +
      '<button type="button" class="btn btn-outline-dark" style="padding:6px 14px;" data-copy="' + escapeHtml(link.code) + '">Copy</button></div>' +
      '<a class="btn btn-primary" style="width:100%;text-align:center;margin:8px 0 12px;" href="' + escapeHtml(link.form_url) + '" target="_blank" rel="noopener">' + ecaT("ti.open_club") + '</a>' +
      '<p class="muted" style="font-size:13px;">' + ecaT("zeffy.tip") + '</p>' +
      '<p class="muted" style="font-size:13px;">' + ecaT("ti.roster_club", { amount: amount, athlete: escapeHtml(data_athlete_name) }) + "</p>" +
      '<button type="button" class="btn btn-outline-dark" style="width:100%;" id="check-paid">' + ecaT("ti.check_btn") + '</button>' +
      (allowDiscount
        ? '<p style="margin-top:14px;font-size:13px;"><a href="#" id="discount-toggle">Have a discount code from the club?</a></p>' +
          '<div id="discount-wrap" style="display:none;"><div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<input type="text" id="discount_code" placeholder="Discount code" style="flex:1;min-width:160px;text-transform:uppercase;">' +
          '<button type="button" class="btn btn-outline-dark" id="discount-apply" style="padding:6px 14px;">Apply</button></div>' +
          '<div id="discount-msg" class="form-msg"></div></div>'
        : "");
    cardEl.appendChild(box);
    payBoxEl = box;

    box.addEventListener("click", async function (e) {
      const copyBtn = e.target.closest("[data-copy]");
      if (copyBtn) {
        try {
          await navigator.clipboard.writeText(copyBtn.dataset.copy);
          copyBtn.textContent = "Copied";
        } catch (err) {
          copyBtn.textContent = copyBtn.dataset.copy;
        }
        setTimeout(function () { copyBtn.textContent = "Copy"; }, 2000);
        return;
      }
      if (e.target.id === "check-paid") { window.location.reload(); return; }
      if (e.target.id === "discount-toggle") {
        e.preventDefault();
        document.getElementById("discount-wrap").style.display = "block";
        document.getElementById("discount_code").focus();
        return;
      }
      if (e.target.id === "discount-apply") {
        const code = document.getElementById("discount_code").value.trim();
        if (!code) return;
        const next = { token: token, discount_code: code };
        if (chosenShirtSize) next.shirt_size = chosenShirtSize;
        requestPayLink(next, null, true);
      }
    });
  }

  let data_athlete_name = "Your athlete";

  init();
</script>
</body>
</html>
